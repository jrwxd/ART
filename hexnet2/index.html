<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexNet 2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <h1>HexNet 2</h1>
    <p class="flavor-text">Connect the network.</p>

    <div id="game-container">
        <div id="game-controls">
            <label for="size-select">Grid Size:</label>
            <select id="size-select">
                <option value="3" selected>3x3</option>
                <option value="5">5x5</option>
                <option value="7">7x7</option>
                <option value="9">9x9</option>
                <option value="11">11x11</option>
            </select>
            <button id="new-game-btn">New Game</button>
            <button id="solve-btn">Solve</button>
        </div>

        <svg id="game-board"></svg>

        <div id="touch-controls">
            <button id="rotate-left-btn">↺</button>
            <button id="lock-tile-btn">🔒</button>
            <button id="rotate-right-btn">↻</button>
        </div>
    </div>

    <div id="win-message">
        <span>Solved</span>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
